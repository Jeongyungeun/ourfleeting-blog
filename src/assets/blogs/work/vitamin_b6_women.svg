<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pmsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E5F5" />
      <stop offset="100%" stop-color="#E1BEE7" />
    </linearGradient>
  </defs>

  <rect width="800" height="400" rx="20" ry="20" fill="url(#pmsBg)" />
  
  <text x="400" y="50" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-weight="bold" font-size="28" fill="#7B1FA2" text-anchor="middle">여성을 위한 비타민 B6</text>
  
  <g transform="translate(150, 100)">
     <rect x="-100" y="0" width="200" height="200" rx="15" fill="white" opacity="0.7"/>
     <text x="0" y="40" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-weight="bold" font-size="20" fill="#8E24AA" text-anchor="middle">PMS 케어</text>
     
     <!-- Moon Icon -->
     <path d="M-20 80 A 30 30 0 1 1 -20 140 A 20 20 0 1 0 -20 80 Z" fill="#BA68C8"/>
     
     <text x="0" y="170" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-weight="bold" font-size="16" fill="#6A1B9A" text-anchor="middle">감정 기복 &amp; 붓기 완화</text>
  </g>
  
  <g transform="translate(400, 100)">
     <rect x="-100" y="0" width="200" height="200" rx="15" fill="white" opacity="0.7"/>
     <text x="0" y="40" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-weight="bold" font-size="20" fill="#8E24AA" text-anchor="middle">입덧 완화</text>
     
     <!-- Stomach/Relief Icon -->
     <path d="M-30 90 Q 0 70 30 90 Q 50 110 30 140 Q 0 160 -30 140 Q -50 110 -30 90" fill="#F06292" opacity="0.3"/>
     <text x="0" y="125" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-weight="bold" font-size="40" fill="#D81B60" text-anchor="middle">OK</text>
     
     <text x="0" y="170" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-weight="bold" font-size="16" fill="#6A1B9A" text-anchor="middle">울렁거림 진정</text>
  </g>
  
  <g transform="translate(650, 100)">
     <rect x="-100" y="0" width="200" height="200" rx="15" fill="white" opacity="0.7"/>
     <text x="0" y="40" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-weight="bold" font-size="20" fill="#8E24AA" text-anchor="middle">호르몬 균형</text>
     
     <!-- Balance Scale Icon -->
     <line x1="-50" y1="80" x2="50" y2="80" stroke="#7B1FA2" stroke-width="4"/>
     <line x1="0" y1="80" x2="0" y2="140" stroke="#7B1FA2" stroke-width="4"/>
     <path d="M-10 140 L10 140 L0 160 Z" fill="#7B1FA2"/>
     
     <text x="0" y="170" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-weight="bold" font-size="16" fill="#6A1B9A" text-anchor="middle">피임약 복용시 필수</text>
  </g>

</svg>
