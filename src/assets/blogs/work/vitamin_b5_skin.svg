<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skinBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FCE4EC" />
      <stop offset="100%" stop-color="#F8BBD0" />
    </linearGradient>
  </defs>

  <rect width="800" height="400" rx="20" ry="20" fill="url(#skinBg)" />
  
  <text x="400" y="50" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-weight="bold" font-size="28" fill="#880E4F" text-anchor="middle">먹고 바르는 비타민 B5</text>
  
  <!-- Skin Section -->
  <g transform="translate(100, 100)">
    <rect x="0" y="0" width="250" height="200" rx="10" fill="white" opacity="0.6"/>
    <text x="125" y="35" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-weight="bold" font-size="20" fill="#C2185B" text-anchor="middle">피부 건강</text>
    
    <!-- Skin Barrier Icon -->
    <rect x="50" y="60" width="150" height="10" rx="2" fill="#F48FB1"/>
    <rect x="50" y="75" width="150" height="10" rx="2" fill="#F48FB1"/>
    <rect x="50" y="90" width="150" height="10" rx="2" fill="#F48FB1"/>
    
    <!-- Moisture Drops -->
    <circle cx="80" cy="140" r="10" fill="#4FC3F7" opacity="0.8"/>
    <circle cx="125" cy="150" r="8" fill="#4FC3F7" opacity="0.8"/>
    <circle cx="170" cy="140" r="10" fill="#4FC3F7" opacity="0.8"/>
    
    <text x="125" y="180" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-weight="bold" font-size="16" fill="#880E4F" text-anchor="middle">보습 &amp; 장벽 강화</text>
  </g>
  
  <!-- Hair Section -->
  <g transform="translate(450, 100)">
    <rect x="0" y="0" width="250" height="200" rx="10" fill="white" opacity="0.6"/>
    <text x="125" y="35" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-weight="bold" font-size="20" fill="#C2185B" text-anchor="middle">모발 건강</text>
    
    <!-- Hair Follicle Icon -->
    <path d="M125 50 Q 80 100 80 150" stroke="#3E2723" stroke-width="4" fill="none"/>
    <path d="M125 50 Q 140 100 140 150" stroke="#3E2723" stroke-width="4" fill="none"/>
    <path d="M125 50 Q 170 100 170 150" stroke="#3E2723" stroke-width="4" fill="none"/>

    <!-- Sparkles for shine -->
    <path d="M90 70 L95 65 L100 70 L95 75 Z" fill="#FFCA28"/>
    <path d="M160 120 L165 115 L170 120 L165 125 Z" fill="#FFCA28"/>

    <text x="125" y="180" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-weight="bold" font-size="16" fill="#880E4F" text-anchor="middle">튼튼하고 윤기있게</text>
  </g>

</svg>
